; Copia este archivo como config.ini y rellena tus datos.

[telegram]
; Obtenlos en https://my.telegram.org -> "API development tools"
api_id = 1234567
api_hash = 0123456789abcdef0123456789abcdef

; Token del bot de control, créalo con @BotFather (/newbot)
bot_token = 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

; Tu ID numérico de Telegram (pídelo a @userinfobot). Solo tú podrás usar el bot.
admin_id = 123456789

; Nombre del archivo de sesión de tu cuenta (se crea con login.py)
session = cuenta

[envio]
; Pausa aleatoria (segundos) entre un grupo y el siguiente, para no parecer spam
pausa_min = 4
pausa_max = 10

; Avisarte por el bot cada vez que se envía un mensaje (si / no).
; Los errores se avisan siempre.
notificar_envios = si

[precio]
; Web de donde se lee el precio para la variable {precio} del texto
url = https://pbm.capital/api/precio
; Expresión que encuentra el número (el primer paréntesis es el precio)
patron = "price"\s*:\s*"?([0-9]+(?:[.,][0-9]+)?)
; Si la página tiene varios precios, cuál usar (1 = el primero)
posicion = 1

[horario]
; Zona horaria y horario en el que NO se publica nada automáticamente
zona = America/Havana
silencio_desde = 23:59
silencio_hasta = 08:00
